# originally copied from https://github.com/BurntSushi/ripgrep/blob/master/.github/workflows/ci.yml
name: ci
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    name: Check code formatting and bindings
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Run cargo fmt
        run: |
          cargo fmt --all -- --check
      - name: Test binding postprocessor
        run: cargo test --locked -p xtask
      - name: Check bindings for bool fields
        run: cargo test --locked -p rbspy-ruby-structs "tests::"

  build:
    name: Build
    env:
      CARGO: cargo
      TARGET_FLAGS: --target ${{ matrix.target }}
      RUST_BACKTRACE: full
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - linux-x86_64
          - linux-aarch64
          - macos-intel
          - macos-aarch64
          - windows
        include:
          - build: linux-x86_64
            os: ubuntu-24.04
            ruby-version: 4.0.0
            run-tests: 'true'
            target: x86_64-unknown-linux-gnu
          - build: linux-aarch64
            os: ubuntu-24.04-arm
            ruby-version: 4.0.0
            run-tests: 'true'
            target: aarch64-unknown-linux-gnu
          - build: macos-intel
            os: macos-15-intel
            ruby-version: 4.0.0
            run-tests: 'true'
            target: x86_64-apple-darwin
          - build: macos-aarch64
            os: macos-15
            ruby-version: 4.0.0
            run-tests: 'true'
            target: aarch64-apple-darwin
          - build: windows
            os: windows-2022
            ruby-version: 3.4.8
            run-tests: 'true'
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Ruby
        uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust toolchain target
        run: |
          rustup target add ${{ matrix.target }}
      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-on-failure: "true"
          key: "${{ matrix.os }}-${{ matrix.target }}"
          prefix-key: "20230109"
      - name: Show command used for Cargo
        run: |
          echo "cargo command is: ${{ env.CARGO }}"
          echo "target flag is: ${{ env.TARGET_FLAGS }}"

      - name: Build rbspy
        run: ${{ env.CARGO }} build --release --locked --workspace --all-targets ${{ env.TARGET_FLAGS }}

      - name: Prepare binary for upload
        if: runner.os != 'windows'
        run: |
          cp target/${{ matrix.target }}/release/rbspy rbspy-${{ matrix.target }}
      - name: Prepare binary for upload
        if: runner.os == 'windows'
        run: |
          copy target/${{ matrix.target }}/release/rbspy.exe rbspy-${{ matrix.target }}.exe

      - name: Upload Linux and macOS Binaries
        if: runner.os != 'windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rbspy-${{ matrix.target }}
          path: rbspy-${{ matrix.target }}
      - name: Upload Windows Binaries
        if: runner.os == 'windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rbspy-${{ matrix.target }}.exe
          path: rbspy-${{ matrix.target }}.exe

      - name: Run tests
        timeout-minutes: 5
        run: ${{ env.CARGO }} test --release ${{ env.TARGET_FLAGS }}
        if: runner.os == 'linux' && matrix.run-tests == 'true'
      - name: Run tests
        timeout-minutes: 5
        run: sudo "PATH=$PATH" ${{ env.CARGO }} test --release ${{ env.TARGET_FLAGS }}
        if: runner.os == 'macOS' && matrix.run-tests == 'true'
      - name: Run tests
        timeout-minutes: 5
        run: ${{ env.CARGO }} test --release ${{ env.TARGET_FLAGS }}
        if: runner.os == 'windows' && matrix.run-tests == 'true'
      - name: Run rbspy with alternative mallocs
        if: runner.os == 'linux' && matrix.run-tests == 'true'
        run: |
          set -e
          sudo apt install -y libjemalloc2 libtcmalloc-minimal4
          os_triple="$(echo ${{ matrix.target }} | sed 's/unknown-linux-gnu/linux-gnu/')"
          target/${{ matrix.target }}/release/rbspy record env LD_PRELOAD=/usr/lib/$os_triple/libjemalloc.so.2 ruby ci/ruby-programs/short_program.rb
          target/${{ matrix.target }}/release/rbspy record env LD_PRELOAD=/usr/lib/$os_triple/libtcmalloc_minimal.so.4 ruby ci/ruby-programs/short_program.rb
      - name: Profile puma under load (single mode)
        if: runner.os != 'windows' && matrix.run-tests == 'true'
        timeout-minutes: 5
        env:
          RBSPY: target/${{ matrix.target }}/release/rbspy
          USE_SUDO: '1'
        run: ci/test-puma.sh
      - name: Profile puma under load (cluster mode)
        if: runner.os != 'windows' && matrix.run-tests == 'true'
        timeout-minutes: 5
        env:
          RBSPY: target/${{ matrix.target }}/release/rbspy
          USE_SUDO: '1'
          WORKERS: '2'
        run: ci/test-puma.sh

  build-linux-cross:
    name: Build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-musl
          - x86_64-musl
        include:
          - target: aarch64-musl
            triple: aarch64-unknown-linux-musl
          - target: x86_64-musl
            triple: x86_64-unknown-linux-musl
    container:
      image: docker://messense/rust-musl-cross:${{ matrix.target }}
      env:
        RUSTUP_HOME: /root/.rustup
        CARGO_HOME: /root/.cargo
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2.9.3
        with:
          prefix-key: "20230109"
      - name: Build
        run: cargo build --release --locked
      - name: Prepare binary for upload
        run: |
          cp target/*/release/rbspy rbspy-${{ matrix.triple }}
      - name: Upload Binaries
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rbspy-${{ matrix.triple }}
          path: rbspy-${{ matrix.triple }}

  build-freebsd:
    name: Build (FreeBSD)
    runs-on: ubuntu-24.04
    env:
      FREEBSD_RELEASE: 14.4-RELEASE
      FREEBSD_BASE_SHA256: 769f60a6eea2938ad6b7943cfbcc17dfaf7d1f7ba59a32b869a00349302df853

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-freebsd

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Cache FreeBSD sysroot
        id: cache-sysroot
        uses: actions/cache@v6.1.0
        with:
          path: ~/freebsd-sysroot
          key: freebsd-sysroot-${{ env.FREEBSD_RELEASE }}-${{ env.FREEBSD_BASE_SHA256 }}

      - name: Fetch FreeBSD sysroot
        if: steps.cache-sysroot.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/base.txz" "https://download.freebsd.org/releases/amd64/$FREEBSD_RELEASE/base.txz"
          echo "$FREEBSD_BASE_SHA256  $RUNNER_TEMP/base.txz" | sha256sum -c -
          mkdir -p ~/freebsd-sysroot
          tar -x -C ~/freebsd-sysroot \
            --exclude './usr/lib/clang' --exclude './usr/lib/libprivate*' \
            -f "$RUNNER_TEMP/base.txz" ./lib ./usr/lib
          find ~/freebsd-sysroot/usr/lib -maxdepth 1 -name '*.a' \
            ! -name 'libgcc*.a' ! -name 'libcompiler_rt.a' ! -name '*_nonshared.a' -delete
          du -sh ~/freebsd-sysroot

      - name: Configure FreeBSD linker
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          lld="$(rustc --print sysroot)/lib/rustlib/$host/bin/gcc-ld/ld.lld"
          test -x "$lld"
          echo "CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_LINKER=clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_RUSTFLAGS=-C link-arg=--target=x86_64-unknown-freebsd${FREEBSD_RELEASE%-RELEASE} -C link-arg=--sysroot=$HOME/freebsd-sysroot -C link-arg=--ld-path=$lld" >> "$GITHUB_ENV"

      - name: Cross-compile rbspy
        shell: bash
        run: |
          cargo build --release --locked --target x86_64-unknown-freebsd
          cp target/x86_64-unknown-freebsd/release/rbspy rbspy

          mkdir -p fbsd-tests
          cargo test --release --locked --no-run --target x86_64-unknown-freebsd --message-format=json-render-diagnostics \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable' \
            | xargs -I{} cp {} fbsd-tests/
          ls -l fbsd-tests
          test -n "$(ls fbsd-tests)"

      - name: Launch Firecracker VM
        uses: acj/freebsd-firecracker-action@v0.13.0
        with:
          verbose: false
          pre-run: |
            rm -rf .cargo
            ln -s $HOME/.cargo .cargo

            include_path="$(mktemp)"
            cat <<EOF > $include_path
            rbspy
            fbsd-tests
            fbsd-tests/*
            ci
            ci/ruby-programs
            ci/ruby-programs/infinite_on_cpu.rb
            ci/ruby-programs/infinite_off_cpu.rb
            ci/ruby-programs/ruby_forks.rb
            .cargo
            .cargo/registry
            .cargo/registry/src
            .cargo/registry/src/index.*
            .cargo/registry/src/index.*/rbspy-testdata-*
            .cargo/registry/src/index.*/rbspy-testdata-*/data
            .cargo/registry/src/index.*/rbspy-testdata-*/data/ruby-coredump-*.gz
            EOF
            
            rsync -r -e "ssh" \
              --relative \
              --copy-links \
              --include-from "$include_path" \
              --exclude "*" \
              . firecracker:
            rm -f "$include_path"
          run-in-vm: |
            mkdir -p /home/runner
            ln -s $(pwd)/.cargo /home/runner/.cargo

            # Workaround for package mismatch warning when new releases come out
            export IGNORE_OSVERSION=yes

            pkg install -y ruby

            ./rbspy --version

            skip_tests="--skip core::ruby_spy::tests --skip sampler::tests"
            failed=0
            ran=0
            for testbin in fbsd-tests/*; do
              ran=$((ran + 1))
              if ! $testbin $skip_tests; then
                failed=1
              fi
            done

            if [ $ran -eq 0 ]; then
              echo "No test binaries found"
              exit 1
            fi
            if [ $failed -ne 0 ]; then
              exit 1
            fi
          post-run: ""

      - name: Prepare binary for upload
        run: |
          mv rbspy rbspy-x86_64-unknown-freebsd
      - name: Upload Binaries
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rbspy-x86_64-unknown-freebsd
          path: rbspy-x86_64-unknown-freebsd

  release:
    name: Create draft release
    runs-on: ubuntu-24.04
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [build, build-freebsd, build-linux-cross]
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: raw-artifacts
      - name: Prepare binary archives
        run: |
          set -euo pipefail

          mkdir staging
          mv $(find raw-artifacts -type f | xargs) staging

          mkdir archives
          cd staging
          for target in $(ls); do
            if echo "$target" | grep -q ".exe" 2>/dev/null; then
              echo "Found Windows binary for target $target"
              zip -j ../archives/$target.zip $target
            else
              echo "Found unix binary for target $target"
              chmod a+x $target
              tar czf ../archives/$target.tar.gz $target
            fi
          done

      - name: Calculate checksums
        run: |
          set -euo pipefail

          cd archives
          for file in *; do
            sha256sum "$file" | awk '{print $1}' > "$file.sha256"
          done

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            archives/*
