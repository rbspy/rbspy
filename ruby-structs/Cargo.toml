[package]
name = "rbspy-ruby-structs"
version = "0.55.0"
authors = ["Adam Jensen <acjensen@gmail.com>", "Julia Evans <julia@jvns.ca>"]
description = "Helper crate for rbspy. Contains Rust bindings for various internal Ruby structures for version 1.9.3 to 4.x."
license = "MIT"
repository = "https://github.com/rbspy/rbspy"
documentation = "https://github.com/rbspy/rbspy"
homepage = "https://rbspy.github.io/"
edition = "2021"

[dependencies]

[dev-dependencies]
proc-macro2 = { version = "1.0", features = ["span-locations"] }
syn = { version = "3.0.9", features = ["full", "visit"] }
